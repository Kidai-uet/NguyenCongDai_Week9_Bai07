name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # 1. Khai báo chiến lược Ma trận (Matrix Strategy)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # 2. Bắt máy ảo chạy theo danh sách hệ điều hành ở trên
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build và kiểm tra dự án (Verify)
        run: mvn -B verify --file pom.xml
      # 3. Đổi tên file Artifact
      - name: Lưu trữ file JAR
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BankSystem-Artifact-${{ matrix.os }}
          path: target/*.jar
      - name: Chạy Checkstyle để sinh báo cáo
        run: mvn checkstyle:checkstyle
        continue-on-error: true # Cho phép chạy tiếp để Bot kịp review dù có lỗi

      - name: Bot thả comment vào Pull Request
        if: github.event_name == 'pull_request'
        uses: dbelyaev/action-checkstyle@master
        with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                reporter: github-pr-review
                checkstyle_config: google_checks.xml # Đảm bảo file cấu hình này có trong dự án của em